server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta desconocida la resuelve React Router en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets con hash en el nombre son inmutables.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
