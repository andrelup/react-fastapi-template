# Pre-commit hooks del monorepo react-fastapi-template.
# Los git hooks son únicos por repositorio, por eso esta config vive en la raíz:
# cada bloque filtra sus archivos con `files: ^backend/` o `files: ^frontend/`.
#
# Instalación (una vez):
#   make install-hooks
# equivale a `npm --prefix frontend ci` + `pre-commit install`. Los hooks del
# frontend usan el ESLint/Prettier de frontend/node_modules, así que las
# dependencias npm tienen que estar instaladas para que el commit no falle.

# ------------------------- Backend (Python) -------------------------
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        files: ^backend/
        args: [--fix]
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        files: ^backend/.*\.py$
        # Mismo alcance y configuración que el job `lint` de CI
        # (`cd backend && mypy --strict .`): todo `backend/` y el [tool.mypy]
        # de backend/pyproject.toml, que desde la raíz no se descubriría solo.
        # `pass_filenames: false` evita que mypy vea solo los ficheros
        # modificados, que daría un veredicto distinto del de CI.
        args: [--config-file=backend/pyproject.toml, --strict, backend]
        pass_filenames: false
        require_serial: true
        # Cada versión copia la de backend/pyproject.toml (dependencies y extra
        # `dev`). `scripts/check_pin_drift.py` falla si dejan de coincidir.
        additional_dependencies:
          - "fastapi==0.141.1"
          - "sqlalchemy[asyncio]==2.0.52"
          - "pydantic==2.13.5"
          - "pydantic-settings==2.15.0"
          - "structlog==26.1.0"
          - "asyncpg==0.31.0"
          - "alembic==1.19.1"
          - "python-jose[cryptography]==3.5.0"
          - "passlib[bcrypt]==1.7.4"
          - "bcrypt==4.0.1"
          - "email-validator==2.3.0"
          - "types-passlib==1.7.7.20260211"
          - "types-python-jose==3.5.0.20260408"
          # Tipadas que importan los tests, el seed y alembic.
          - "pytest==9.1.1"
          - "pytest-asyncio==1.4.0"
          - "httpx==0.28.1"
          - "faker==40.37.0"

  # Deriva de versiones: los hooks de ruff y mypy son repos remotos y sus
  # versiones se copian a mano de backend/pyproject.toml. Este hook falla si
  # las copias dejan de coincidir (ADR 0007). `language: python` crea un
  # entorno aislado propio (con PyYAML), así que no depende del PATH ni del .venv.
  - repo: local
    hooks:
      - id: check-pin-drift
        name: pre-commit pins match pyproject
        entry: python scripts/check_pin_drift.py
        language: python
        additional_dependencies: ["pyyaml==6.0.3"]
        files: ^(\.pre-commit-config\.yaml|backend/pyproject\.toml|scripts/check_pin_drift\.py)$
        pass_filenames: false

# ------------------------- Frontend (React) -------------------------
# `pass_filenames: false` es intencionado: ESLint 9 con flat config resuelve
# eslint.config.js desde el cwd, y pre-commit ejecuta desde la raíz del
# monorepo. `npm --prefix frontend` entra en el directorio correcto y lintea
# todo src/; el filtro `files:` es el que limita cuándo se dispara el hook.
  - repo: local
    hooks:
      - id: frontend-eslint
        name: eslint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
        require_serial: true

      - id: frontend-prettier
        name: prettier (frontend)
        entry: npm --prefix frontend run format:check
        language: system
        files: ^frontend/.*\.(ts|tsx|js|json|css|html|md)$
        pass_filenames: false
        require_serial: true
