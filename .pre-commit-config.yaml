# Pre-commit hooks del monorepo react-fastapi-template.
# Los git hooks son únicos por repositorio, por eso esta config vive en la raíz:
# cada bloque filtra sus archivos con `files: ^backend/` o `files: ^frontend/`.
#
# Instalación (una vez):
#   make install-hooks
# equivale a `npm --prefix frontend ci` + `pre-commit install`, y necesita el
# `.venv` que crea `make setup`. Los hooks usan las herramientas ya instaladas
# en el proyecto: los del backend, el ruff y el mypy del `.venv`; los del
# frontend, el ESLint y el Prettier de frontend/node_modules.

# ------------------------- Backend (Python) -------------------------
# ruff y mypy se ejecutan desde el `.venv` del proyecto, el que instala
# `pip install -e ".[dev]"` a partir de backend/pyproject.toml. Esa es la única
# lista de versiones, como frontend/package.json lo es para ESLint y Prettier:
# añadir o subir una librería no obliga a tocar este fichero (ADR 0007).
# pre-commit no pone el `.venv` en el PATH, así que `scripts/run_in_venv.py`
# llama a su intérprete por ruta; `language: python` solo aporta un Python con
# el que lanzar ese script, sin dependencias propias.
repos:
  - repo: local
    hooks:
      # `--force-exclude` y `require_serial` son los que fijaba ruff-pre-commit:
      # el `exclude` de pyproject.toml se respeta aunque pre-commit pase el
      # fichero de forma explícita.
      - id: ruff-check
        name: ruff check (backend)
        entry: python scripts/run_in_venv.py ruff check --fix --force-exclude
        language: python
        types_or: [python, pyi]
        files: ^backend/
        require_serial: true

      - id: ruff-format
        name: ruff format (backend)
        entry: python scripts/run_in_venv.py ruff format --force-exclude
        language: python
        types_or: [python, pyi]
        files: ^backend/
        require_serial: true

      # El mismo comando que el job `lint` de CI (`cd backend && mypy --strict .`):
      # todo `backend/` con su [tool.mypy]. `pass_filenames: false` evita que
      # mypy vea solo los ficheros modificados. También se dispara al cambiar
      # pyproject.toml, porque una subida de versión o un cambio en [tool.mypy]
      # pueden romper el tipado sin tocar ningún .py.
      - id: mypy
        name: mypy (backend)
        entry: python scripts/run_in_venv.py --cwd backend mypy --strict .
        language: python
        files: ^backend/(.*\.pyi?|pyproject\.toml)$
        pass_filenames: false
        require_serial: true

# ------------------------- Frontend (React) -------------------------
# `pass_filenames: false` es intencionado: ESLint 9 con flat config resuelve
# eslint.config.js desde el cwd, y pre-commit ejecuta desde la raíz del
# monorepo. `npm --prefix frontend` entra en el directorio correcto y lintea
# todo src/; el filtro `files:` es el que limita cuándo se dispara el hook.
  - repo: local
    hooks:
      - id: frontend-eslint
        name: eslint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
        require_serial: true

      - id: frontend-prettier
        name: prettier (frontend)
        entry: npm --prefix frontend run format:check
        language: system
        files: ^frontend/.*\.(ts|tsx|js|json|css|html|md)$
        pass_filenames: false
        require_serial: true
