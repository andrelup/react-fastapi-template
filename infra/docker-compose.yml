# Entorno de infraestructura de react-fastapi-template.
#
# Las credenciales viven en el .env de la raiz del monorepo (no versionado,
# ver .env.example) y se inyectan por interpolación, por eso los comandos
# canónicos son (desde la raiz del repo):
#
#   make dev    solo PostgreSQL; el backend y el frontend se ejecutan
#               nativos en el host con hot reload (uvicorn / vite)
#   make prod   el stack completo con las imagenes de produccion
#
# Docker se usa aqui para dos cosas y solo dos: la base de datos en
# desarrollo, y las imagenes que realmente se despliegan. No hay servicios de
# desarrollo contenedorizados ni volumenes con el codigo fuente montado.
#
# Los servicios "backend" y "frontend" viven bajo el perfil "prod", asi que un
# `docker compose up` sin perfil levanta unicamente postgres.
name: react-fastapi-template

# Rotacion del fichero de log que el demonio de Docker mantiene en el host por
# cada contenedor (/var/lib/docker/containers/<id>/<id>-json.log; en Windows,
# dentro del disco de la VM de WSL2). El driver json-file rota por TAMANO, no
# por tiempo: no existe una opcion de "30 dias". 20 MB por fichero y 15
# ficheros son 300 MB de tope duro por contenedor, muchisimo mas de 30 dias
# con el volumen de este proyecto. La retencion expresada en dias es cosa del
# agregador de logs, cuando lo haya.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "15"

services:
  postgres:
    image: postgres:16
    container_name: react-fastapi-template-postgres
    logging: *default-logging
    environment:
      POSTGRES_USER: ${DB_USERNAME:?falta DB_USERNAME en el env-file}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en el env-file}
      POSTGRES_DB: ${DB_NAME:?falta DB_NAME en el env-file}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    profiles: ["prod"]
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: fastapi-template
    # Solo los servicios del perfil "prod" reinician solos: son los que
    # representan el despliegue real, donde nadie esta mirando cuando algo
    # cae. postgres se queda sin politica a proposito, porque en desarrollo se
    # levanta y se para a voluntad.
    restart: unless-stopped
    logging: *default-logging
    environment:
      APP_NAME: ${APP_NAME:-fastapi-template API}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # Dentro de la red de Docker el backend habla con el servicio
      # "postgres" por su nombre, no con el host/puerto expuesto al host.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:?falta DB_USERNAME en el env-file}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en el env-file}
      DB_NAME: ${DB_NAME:?falta DB_NAME en el env-file}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Origenes permitidos para CORS (lista separada por comas). Cada entorno
      # define en su .env solo los origenes que realmente sirve.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?falta JWT_SECRET_KEY en el env-file}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRES_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRES_MINUTES:-60}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # Sin --reload y sin volumenes: el codigo viaja dentro de la imagen. Las
    # migraciones se aplican al arrancar, con el alembic/ que la imagen copia.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn src.main:app --host 0.0.0.0 --port 8000"

  frontend:
    profiles: ["prod"]
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Vite hornea la URL de la API en el bundle en tiempo de build, no de
        # ejecucion: por eso es un build arg y no una variable de entorno. Es
        # la URL tal y como la ve el navegador del host, no la red interna.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: react-template
    restart: unless-stopped
    logging: *default-logging
    # nginx sirve la SPA compilada en el 80 del contenedor (como usuario no
    # root); al host se publica en el 3000, el mismo puerto que en desarrollo,
    # para que CORS_ALLOWED_ORIGINS valga sin cambios.
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
