# Pipeline de integración continua del backend (FastAPI).
#
# Se dispara solo cuando cambia `backend/**` o este mismo workflow: en un
# monorepo, una PR que toca únicamente el frontend no debe pagar el coste de
# levantar PostgreSQL ni de instalar las dependencias de Python.
#
# Orden: lint -> test-backend. El umbral de cobertura (80%) NO se pasa por
# línea de comandos: vive en `backend/pyproject.toml` ([tool.coverage.report]
# fail_under), de modo que `pytest --cov=src` falla igual en local y en CI.
name: CI Backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          # No hay lockfile ni requirements.txt: las dependencias se declaran
          # en pyproject.toml y se instalan con `pip install -e ".[dev]"`.
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy --strict .

  test-backend:
    name: test-backend
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bookshelf
          POSTGRES_PASSWORD: bookshelf
          POSTGRES_DB: bookshelf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookshelf -d bookshelf"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # `src/config/settings.py` instancia `Settings()` en tiempo de import y
    # `db_password` / `jwt_secret_key` no tienen valor por defecto: sin estas
    # variables la propia recolección de tests reventaría al importar. En CI no
    # existe el `.env` de la raíz, así que el entorno es la única fuente.
    # No son secretos: apuntan al contenedor efímero `services.postgres`, que
    # solo vive dentro de este job y no es accesible desde fuera del runner.
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USERNAME: bookshelf
      DB_PASSWORD: bookshelf
      DB_NAME: bookshelf
      JWT_SECRET_KEY: ci-only-not-a-real-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # `tests/conftest.py` abre sesiones contra la BD real y da por hecho que
      # la tabla `users` ya existe, de ahí que las migraciones vayan antes.
      - name: Run database migrations
        run: alembic upgrade head

      # Los tests de `tests/integration/` levantan su propio contenedor
      # `postgres:16-alpine` en el puerto 55433 con el CLI de Docker
      # (ver tests/integration/conftest.py). En `ubuntu-latest` Docker está
      # disponible, así que funcionan tal cual y no se tocan.
      - name: Run tests with coverage
        run: pytest --cov=src --cov-report=term-missing
