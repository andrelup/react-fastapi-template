# Pipeline de integración continua del backend (FastAPI).
#
# Se dispara solo cuando cambia `backend/**`, este mismo workflow,
# `scripts/run_in_venv.py` (el lanzador de los hooks de pre-commit del backend)
# o `scripts/setup.py` (el de `make setup`), cuyos tests viven en
# `backend/tests/unit/`: en un monorepo, una PR que toca
# únicamente el frontend no debe pagar el coste de levantar PostgreSQL ni de
# instalar las dependencias de Python.
#
# Orden: lint -> test-backend. El umbral de cobertura (80%) NO se pasa por
# línea de comandos: vive en `backend/pyproject.toml` ([tool.coverage.report]
# fail_under), de modo que `pytest --cov=src` falla igual en local y en CI.
name: CI Backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
      - 'scripts/run_in_venv.py'
      - 'scripts/setup.py'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
      - 'scripts/run_in_venv.py'
      - 'scripts/setup.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          # No hay lockfile ni requirements.txt: las dependencias se declaran
          # en pyproject.toml y se instalan con `pip install -e ".[dev]"`.
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy --strict .

  test-backend:
    name: test-backend
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: react-fastapi-template
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d react-fastapi-template"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # La configuración sale del secret de Actions `CI_DOTENV`, que el
      # mantenedor crea a mano con el contenido de un `.env`: valores de
      # mentira y las mismas credenciales que el servicio `postgres` de arriba,
      # que solo vive dentro de este job. Se vuelca al `.env` de la raíz, el
      # mismo fichero que lee `src/config/settings.py` en local; sin él la
      # recolección de tests revienta, porque `Settings()` se instancia al
      # importar y las direcciones y los secretos no tienen valor por defecto.
      - name: Write .env from the CI secret
        working-directory: .
        env:
          CI_DOTENV: ${{ secrets.CI_DOTENV }}
        run: |
          if [ -z "$CI_DOTENV" ]; then
            echo "::error::Falta el secret CI_DOTENV (o está vacío): créalo en Settings > Secrets and variables > Actions con el contenido de un .env para CI, partiendo de .env.example"
            exit 1
          fi
          printf '%s\n' "$CI_DOTENV" > .env

      # `tests/conftest.py` abre sesiones contra la BD real y da por hecho que
      # la tabla `users` ya existe, de ahí que las migraciones vayan antes.
      - name: Run database migrations
        run: alembic upgrade head

      # Los tests de `tests/integration/` usan las fixtures de
      # `tests/conftest.py`, que hablan con el servicio `postgres` declarado
      # arriba. No levantan ningún contenedor propio.
      - name: Run tests with coverage
        run: pytest --cov=src --cov-report=term-missing
