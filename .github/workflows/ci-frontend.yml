# Pipeline de integración continua del frontend (React + Vite).
#
# Se dispara solo cuando cambia `frontend/**` o este mismo workflow, para que
# una PR que toca únicamente el backend no arrastre `npm ci`.
#
# Orden: lint -> test-frontend. El umbral de cobertura se define en
# `frontend/vite.config.ts` (coverage.thresholds), no en este YAML.
name: CI Frontend

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Falla pronto si `engines.node` o el ARG del Dockerfile se desvían de
      # `.nvmrc`, la fuente de la versión de Node.
      - name: Check Node version consistency
        run: |
          major="$(tr -d '[:space:]v' < .nvmrc)"
          docker_default="$(sed -n 's/^ARG NODE_VERSION=//p' Dockerfile | head -n1)"
          engines="$(sed -n 's/.*"node": *"\([^"]*\)".*/\1/p' package.json | head -n1)"
          status=0
          if [ "$docker_default" != "$major" ]; then
            echo "::error file=frontend/Dockerfile::ARG NODE_VERSION=$docker_default does not match .nvmrc ($major)"
            status=1
          fi
          if [ "$engines" != "^$major" ]; then
            echo "::error file=frontend/package.json::engines.node is '$engines', expected '^$major' (from .nvmrc)"
            status=1
          fi
          exit "$status"

      # La versión de Node sale de `frontend/.nvmrc` (la ruta es relativa a la
      # raíz del repo, no a `working-directory`). `engines` y el ARG del
      # Dockerfile la repiten; el paso anterior comprueba que coinciden.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run typecheck

  test-frontend:
    name: test-frontend
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # vitest carga `vite.config.ts`, que se niega a arrancar sin la URL de la
      # API y la busca en el `.env` de la raíz. La configuración sale del
      # secret de Actions `CI_DOTENV`, el mismo que usa `ci-backend.yml`: el
      # mantenedor lo crea a mano con valores de mentira.
      - name: Write .env from the CI secret
        working-directory: .
        env:
          CI_DOTENV: ${{ secrets.CI_DOTENV }}
        run: |
          if [ -z "$CI_DOTENV" ]; then
            echo "::error::Falta el secret CI_DOTENV (o está vacío): créalo en Settings > Secrets and variables > Actions con el contenido de un .env para CI, partiendo de .env.example"
            exit 1
          fi
          printf '%s\n' "$CI_DOTENV" > .env

      - name: Run tests with coverage
        run: npm run test:coverage
