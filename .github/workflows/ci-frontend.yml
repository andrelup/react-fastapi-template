# Pipeline de integración continua del frontend (React + Vite).
#
# Se dispara solo cuando cambia `frontend/**` o este mismo workflow, para que
# una PR que toca únicamente el backend no arrastre `npm ci`.
#
# Orden: lint -> test-frontend. El umbral de cobertura se define en
# `frontend/vite.config.ts` (coverage.thresholds), no en este YAML.
name: CI Frontend

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # El repo no fija la versión de Node (no hay `engines`, `.nvmrc` ni
      # `packageManager`), así que se pinta aquí la misma que usa
      # `frontend/Dockerfile` (node:24-alpine) para que local, Docker y CI
      # compilen con el mismo runtime.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run typecheck

  test-frontend:
    name: test-frontend
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage
